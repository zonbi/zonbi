<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc" class="hero-art">
  <title id="hero-title">代行さん</title>
  <desc id="hero-desc">スマホから届いた依頼を、ショッピングバッグを持った代行さんがまとめて買いに行くイラスト</desc>
  <style>
    .hero-art { --ink: var(--text, #3b2a3a); --pc: var(--primary, #e0457b); --ps: var(--primary-soft, #fde7ef); --bg2: var(--card, #fff); }
    .hero-art .ink { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .hero-art .thin { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .hero-art .pc { fill: var(--pc); }
    .hero-art .ps { fill: var(--ps); }
    .hero-art .wh { fill: var(--bg2); }
    .hero-art .inkf { fill: var(--ink); }
    .hero-art .blush { fill: #ff9fbf; opacity: .75; }
    .hero-art .y { fill: #ffd25e; }
    .hero-art .b { fill: #8fd3ff; }
    .hero-art .m { fill: #9be3c6; }
    .hero-art .l { fill: #c9b2ff; }
    .hero-art .dash { fill: none; stroke: var(--pc); stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; opacity: .7; }
    .hero-art text { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 800; fill: var(--ink); }
    @media (prefers-reduced-motion: no-preference) {
      .hero-art .float1 { animation: hf 4s ease-in-out infinite; }
      .hero-art .float2 { animation: hf 5s ease-in-out -1.5s infinite; }
      .hero-art .float3 { animation: hf 4.5s ease-in-out -3s infinite; }
      .hero-art .twinkle { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .hero-art .twinkle.d2 { animation-delay: -.8s; }
      .hero-art .twinkle.d3 { animation-delay: -1.6s; }
      .hero-art .bob { animation: bob 3s ease-in-out infinite; }
    }
    @keyframes hf { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes tw { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  </style>

  <!-- 背景のふんわりした形 -->
  <path class="ps" d="M70 300 C 40 200, 140 110, 260 130 C 360 145, 380 70, 500 60 C 640 48, 700 120, 820 105 C 960 88, 1110 110, 1140 220 C 1170 330, 1040 360, 900 350 L 230 352 C 140 352, 90 340, 70 300 Z" opacity=".75"/>
  <circle class="ps" cx="1080" cy="70" r="34" opacity=".6"/>
  <circle class="ps" cx="120" cy="80" r="22" opacity=".6"/>

  <!-- 依頼者たち（左）：スマホから注文 -->
  <g class="float1">
    <g transform="translate(130 210)">
      <ellipse class="b ink" cx="0" cy="30" rx="44" ry="48"/>
      <circle class="inkf" cx="-14" cy="22" r="5"/><circle class="inkf" cx="14" cy="22" r="5"/>
      <circle class="wh" cx="-12" cy="20" r="1.8"/><circle class="wh" cx="16" cy="20" r="1.8"/>
      <ellipse class="blush" cx="-26" cy="36" rx="7" ry="4.5"/><ellipse class="blush" cx="26" cy="36" rx="7" ry="4.5"/>
      <path class="thin" fill="none" d="M-6 38 q6 6 12 0"/>
      <rect class="wh ink" x="22" y="42" width="26" height="40" rx="6" transform="rotate(-14 35 62)"/>
      <path class="pc" d="M32 58 l4 -4 a3.4 3.4 0 0 1 5 5 l-9 9 l-9 -9 a3.4 3.4 0 0 1 5 -5 z" transform="rotate(-14 35 62) translate(3 2) scale(.7)"/>
    </g>
    <!-- 吹き出し -->
    <g transform="translate(40 92)">
      <rect class="wh ink" x="0" y="0" width="150" height="56" rx="20"/>
      <path class="wh ink" d="M92 54 l10 20 l8 -21"/>
      <rect class="wh" x="88" y="46" width="26" height="10"/>
      <text x="75" y="36" font-size="22" text-anchor="middle">アクスタ×2</text>
    </g>
  </g>

  <g class="float2">
    <g transform="translate(300 230)">
      <ellipse class="m ink" cx="0" cy="26" rx="38" ry="42"/>
      <path class="ink" fill="none" d="M-12 18 q5 -5 10 0 M2 18 q5 -5 10 0" transform="translate(1 2)"/>
      <ellipse class="blush" cx="-22" cy="32" rx="6" ry="4"/><ellipse class="blush" cx="22" cy="32" rx="6" ry="4"/>
      <path class="thin" fill="none" d="M-5 34 q5 5 10 0"/>
      <rect class="wh ink" x="-50" y="36" width="24" height="36" rx="6" transform="rotate(12 -38 54)"/>
    </g>
    <g transform="translate(250 118)">
      <rect class="wh ink" x="0" y="0" width="140" height="52" rx="20"/>
      <path class="wh ink" d="M40 50 l-6 20 l18 -19"/>
      <rect class="wh" x="30" y="42" width="26" height="10"/>
      <text x="70" y="34" font-size="21" text-anchor="middle">缶バッジ×3</text>
    </g>
  </g>

  <!-- 依頼が代行さんへ届く点線 -->
  <path class="dash" d="M190 140 C 300 40, 420 60, 500 130"/>
  <path class="dash" d="M395 150 C 440 140, 470 150, 505 175"/>

  <!-- 代行さん（中央） -->
  <g class="bob">
    <!-- 左の袋 -->
    <g transform="translate(430 230)">
      <path class="ink" fill="none" d="M18 10 q22 -36 44 0"/>
      <path class="pc ink" d="M0 12 h80 l-6 78 a8 8 0 0 1 -8 7 h-52 a8 8 0 0 1 -8 -7 z"/>
      <path class="wh" d="M40 40 l7 -7 a5.5 5.5 0 0 1 8 8 l-15 15 l-15 -15 a5.5 5.5 0 0 1 8 -8 z"/>
    </g>
    <!-- 右の袋 -->
    <g transform="translate(690 236)">
      <path class="ink" fill="none" d="M16 8 q20 -32 40 0"/>
      <path class="y ink" d="M0 10 h72 l-5 70 a8 8 0 0 1 -8 7 h-46 a8 8 0 0 1 -8 -7 z"/>
      <path class="wh" d="M36 28 l5 11 l12 1 l-9 8 l3 12 l-11 -6 l-11 6 l3 -12 l-9 -8 l12 -1 z"/>
    </g>
    <!-- 腕 -->
    <path class="ink" fill="none" d="M528 228 q-30 10 -56 12"/>
    <path class="ink" fill="none" d="M672 228 q30 10 52 16"/>
    <!-- 足 -->
    <ellipse class="wh ink" cx="570" cy="330" rx="22" ry="12"/>
    <ellipse class="wh ink" cx="630" cy="330" rx="22" ry="12"/>
    <!-- 体 -->
    <path class="wh ink" d="M600 110 C 680 110, 700 180, 696 240 C 692 300, 650 326, 600 326 C 550 326, 508 300, 504 240 C 500 180, 520 110, 600 110 Z"/>
    <!-- エプロン（「代」マーク） -->
    <path class="ps ink" d="M548 236 h104 v40 a52 30 0 0 1 -104 0 z"/>
    <circle class="pc" cx="600" cy="262" r="17"/>
    <text x="600" y="270" font-size="20" text-anchor="middle" style="fill:#fff">代</text>
    <!-- 顔 -->
    <ellipse class="inkf" cx="574" cy="186" rx="8" ry="10"/><ellipse class="inkf" cx="626" cy="186" rx="8" ry="10"/>
    <circle class="wh" cx="577" cy="182" r="3"/><circle class="wh" cx="629" cy="182" r="3"/>
    <ellipse class="blush" cx="552" cy="208" rx="11" ry="7"/><ellipse class="blush" cx="648" cy="208" rx="11" ry="7"/>
    <path class="ink" fill="none" d="M588 206 q12 12 24 0"/>
    <!-- 帽子＆リボン -->
    <path class="pc ink" d="M548 132 C 560 92, 640 92, 652 132 C 620 122, 580 122, 548 132 Z"/>
    <path class="y ink" d="M600 100 l-22 -14 v28 z M600 100 l22 -14 v28 z"/>
    <circle class="y ink" cx="600" cy="100" r="7"/>
  </g>

  <!-- スマホ（右）：一覧と合計 -->
  <g class="float3" transform="translate(830 92)">
    <rect class="wh ink" x="0" y="0" width="150" height="250" rx="24"/>
    <rect class="ps" x="14" y="26" width="122" height="198" rx="12"/>
    <rect class="inkf" x="58" y="10" width="34" height="6" rx="3"/>
    <g transform="translate(26 44)">
      <rect class="wh" x="0" y="0" width="98" height="30" rx="8"/><circle class="m" cx="15" cy="15" r="8"/><path class="thin" fill="none" d="M11 15 l3 3 l6 -7"/><rect class="l" x="30" y="11" width="52" height="8" rx="4"/>
      <rect class="wh" x="0" y="40" width="98" height="30" rx="8"/><circle class="m" cx="15" cy="55" r="8"/><path class="thin" fill="none" d="M11 55 l3 3 l6 -7"/><rect class="b" x="30" y="51" width="40" height="8" rx="4"/>
      <rect class="wh" x="0" y="80" width="98" height="30" rx="8"/><circle class="wh ink" cx="15" cy="95" r="7" style="stroke-width:2.5"/><rect class="y" x="30" y="91" width="56" height="8" rx="4"/>
      <rect class="pc" x="0" y="124" width="98" height="40" rx="10"/>
      <text x="49" y="151" font-size="19" text-anchor="middle" style="fill:#fff">合計12個</text>
    </g>
  </g>

  <!-- 推し活グッズ（右上・右下） -->
  <g class="float1" transform="translate(1012 70) rotate(10)">
    <!-- アクリルスタンド -->
    <rect class="b ink" x="0" y="0" width="58" height="84" rx="10" opacity=".95"/>
    <path class="wh" d="M29 16 l7 15 l16 2 l-12 11 l3 16 l-14 -8 l-14 8 l3 -16 l-12 -11 l16 -2 z"/>
    <rect class="l ink" x="-6" y="84" width="70" height="14" rx="5"/>
  </g>
  <g class="float2" transform="translate(1050 252)">
    <!-- 缶バッジ -->
    <circle class="pc ink" cx="0" cy="0" r="34"/>
    <circle class="wh" cx="0" cy="0" r="24"/>
    <path class="pc" d="M0 -2 l7 -7 a5 5 0 0 1 7 7 l-14 14 l-14 -14 a5 5 0 0 1 7 -7 z" transform="translate(0 2)"/>
  </g>
  <g class="float3" transform="translate(760 76) rotate(-24)">
    <!-- ペンライト -->
    <rect class="y ink" x="-9" y="-58" width="18" height="62" rx="9"/>
    <rect class="l ink" x="-11" y="2" width="22" height="40" rx="6"/>
    <path class="y" d="M0 -78 v-10 M-18 -70 l-7 -7 M18 -70 l7 -7" style="stroke:#ffd25e;stroke-width:4;stroke-linecap:round"/>
  </g>

  <!-- キラキラ・ハート -->
  <path class="y twinkle" d="M420 40 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z"/>
  <path class="pc twinkle d2" d="M720 330 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
  <path class="l twinkle d3" d="M1150 160 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z"/>
  <path class="m twinkle" d="M40 330 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
  <path class="pc twinkle d3" d="M700 44 l6 -6 a4.5 4.5 0 0 1 6.5 6.5 l-12.5 12.5 l-12.5 -12.5 a4.5 4.5 0 0 1 6.5 -6.5 z"/>
  <path class="pc twinkle d2" d="M230 330 l5 -5 a3.6 3.6 0 0 1 5 5 l-10 10 l-10 -10 a3.6 3.6 0 0 1 5 -5 z"/>
</svg>
